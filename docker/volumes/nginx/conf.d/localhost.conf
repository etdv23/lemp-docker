server {
    listen 80;    
    server_name ~^(?<subdomain>.+)\.localhost$;
    root /var/www/$subdomain;

    index index.php index.html;

    charset utf-8;
    client_max_body_size 100M;
   
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
 
    error_page 404 /index.php;      

    location / {
        try_files $uri $uri/ /index.php?$query_string;

        location ~* ^.+\.(css|htm|html|js|json|xml|apng|avif|bmp|cur|gif|ico|jfif|jpg|jpeg|pjp|pjpeg|png|svg|tif|tiff|webp|aac|caf|flac|m3a|midi|mp3|ogg|opus|wav|3gp|av1|avi|m4v|mkv|mov|mpg|mpeg|mp4|mp4v|webm|otf|ttf|woff|woff2|doc|docx|odf|odp|ods|odt|pdf|ppt|pptx|rtf|txt|xls|xlsx|7z|bz2|gz|rar|tar|tgz|zip|apk|appx|bin|dmg|exe|img|iso|jar|msi|webmanifest)$ {
            expires 1d;
            add_header Cache-Control "public, immutable";
        }
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Handle PHP files
    # location ~ ^/index\.php(/|$) {
    location ~ \.php$ {
        # Security: Don't process non-existent files
        try_files $uri =404;
        
        # FastCGI configuration
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        
        # Include default FastCGI parameters
        include fastcgi_params;
        
        # Override SCRIPT_FILENAME parameter
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    
    location ~ /\.(?!well-known\/|file) {
		deny all;
		return 404;
	}

    location ~* "/(^$|readme|license|example|README|LEGALNOTICE|INSTALLATION|CHANGELOG)\.(txt|html|md)" {
        deny all;
    }
}
